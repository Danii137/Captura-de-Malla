<!doctype html>
<html><head><meta charset="utf-8"><title>Prueba three.js</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#222}</style></head>
<body>
<script type="importmap">{ "imports": { "three": "/three.module.js" } }</script>
<script type="module">
import * as THREE from 'three';
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 200);
camera.position.set(10, 8, 10); camera.lookAt(0, 0, 0);
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2));
// textura de cuadros (roja arriba-izquierda)
const cv = document.createElement('canvas'); cv.width = 64; cv.height = 64;
const cx = cv.getContext('2d');
for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) { cx.fillStyle = (x + y) % 2 ? '#ffffff' : '#ff0000'; cx.fillRect(x * 8, y * 8, 8, 8); }
cx.fillStyle = '#0000ff'; cx.fillRect(0, 0, 16, 16);
const tex = new THREE.CanvasTexture(cv);
const box = new THREE.Mesh(new THREE.BoxGeometry(2, 1, 3), new THREE.MeshBasicMaterial({ map: tex }));
box.position.set(5, 0, 0); box.rotation.y = Math.PI / 6; scene.add(box);
const sph = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 16), new THREE.MeshStandardMaterial({ color: 0x00ff00 }));
sph.position.set(-3, 1, 2); sph.scale.setScalar(0.5); scene.add(sph);
const inst = new THREE.InstancedMesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), new THREE.MeshStandardMaterial({ color: 0x3366ff }), 3);
const m = new THREE.Matrix4();
for (let i = 0; i < 3; i++) { m.makeTranslation(i, 0, -5); inst.setMatrixAt(i, m); }
scene.add(inst);
let t = 0;
function loop() { t += 0.01; camera.position.set(10 * Math.cos(t * 0.1), 8, 10 * Math.sin(t * 0.1) + 3); camera.lookAt(0, 0, 0); renderer.render(scene, camera); requestAnimationFrame(loop); }
loop();
</script></body></html>
